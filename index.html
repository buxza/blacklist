<title>BLACKLIST</title>
<style>
:root{color-scheme:dark;--o:#FF5500;--c:#00F0FF;--r:#FF1744;--p:#0f0f12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
body{background:repeating-linear-gradient(115deg,#050505 0 20px,#0a0a0a 20px 21px),linear-gradient(#050505,#050505);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background-blend-mode:normal}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(transparent 50%,#ff55002e),linear-gradient(#00f0ff1a,transparent 40%);pointer-events:none;z-index:-1}
#app{max-width:480px;margin:0 auto;padding:14px 18px 28px;min-height:100vh;min-height:100dvh}
.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.fr{background:var(--p);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:inset 0 0 0 2px var(--c,#FF5500),inset 0 0 18px #ff55001f;padding:16px;margin:12px 0}
.fr.red{--c:var(--r);animation:pu 1.4s infinite alternate}
@keyframes pu{from{filter:brightness(.7)}to{filter:brightness(1.25)}}
.btn{display:block;width:100%;border:0;margin:10px 0;padding:15px 8px;font:italic 900 19px/1 -apple-system,Arial,sans-serif;color:var(--c,#FF5500);background:#000a;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:inset 0 0 0 2px currentColor;cursor:pointer;text-transform:uppercase;transition:transform .1s}
.btn:active{transform:scale(.95)}
.btn small{display:block;font:600 11px/1.3 sans-serif;opacity:.85;margin-top:5px;font-style:normal;text-transform:none}
.btn.on{background:var(--c,#FF5500);color:#000;box-shadow:none}
.btn.red{--c:var(--r)}.btn.cy{--c:var(--c2)}
.btn.cy{color:#00F0FF}.btn.cy.on{background:#00F0FF;color:#000}
.btn.w{color:#fff;font-size:14px;padding:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.c{text-align:center;display:flex;flex-direction:column;align-items:center;min-height:90vh;justify-content:center}
.wm{font:italic 900 44px/1 Impact,"Arial Black",sans-serif;margin:6px 0 2px;background:linear-gradient(var(--o),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #ff550099);letter-spacing:1px}
.sub{font:italic 800 12px sans-serif;letter-spacing:4px;color:var(--c)}
.q{font:italic 700 18px/1.35 sans-serif;margin:18px 6px}
.row{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.row em{font:700 12px monospace;color:var(--c);font-style:normal;margin-left:auto}
.or{color:var(--o);font:italic 900 28px sans-serif}.cy{color:var(--c)}.rd{color:var(--r)}
small{color:#9aa;font-size:10px;font-weight:700;display:block;margin:4px 0}
.tb{display:flex;gap:3px;transform:skewX(-17deg);margin:6px 0}
.tb i{flex:1;height:14px;background:#ffffff14}
.tb i.on{background:var(--c,#FF5500);box-shadow:0 0 6px var(--c,#FF5500)}
.tb i.hot.on{background:#FF1744;box-shadow:0 0 6px #FF1744}
h2{font:italic 900 34px sans-serif;color:var(--o);margin:10px 0;text-shadow:0 0 10px #ff550099}

.chip{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px;background:#0f0f12;color:#777;border:0;font:700 14px sans-serif;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:inset 0 0 0 2px #333;cursor:pointer}
.chip.on{color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.chip span{font-size:20px}.chip small{color:inherit;opacity:.7;font-weight:500;font-size:11px}
.pills{display:flex;gap:8px}.pills button{flex:1;padding:10px;border:0;background:none;color:#00F0FF;font:italic 900 18px sans-serif;box-shadow:inset 0 0 0 2px #00F0FF;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.pills button.on{background:#00F0FF;color:#000}
input{width:100%;margin:5px 0;padding:13px;background:#0f0f12;border:0;color:#fff;font:italic 800 17px sans-serif;text-transform:uppercase;box-shadow:inset 0 0 0 2px #00F0FF;outline:0}
.top{display:flex;gap:12px;align-items:center}
.x{width:40px;height:40px;border:0;background:#000;color:#00F0FF;font-size:16px;box-shadow:inset 0 0 0 2px #00F0FF}
.big2{font:italic 900 22px sans-serif}
.sc{flex:1;text-align:center;padding:5px;box-shadow:inset 0 0 0 1.5px #00F0FF66;color:#00F0FF}.sc.a{background:#00F0FF;color:#000}.sc.a small{color:#000}
.scs{display:flex;gap:8px;margin-top:10px}
.card{animation:in .35s;min-height:46vh;display:flex;flex-direction:column;gap:12px}

.tx{font:700 21px/1.35 sans-serif;margin:6px 0;flex:1}
.big{display:block;text-align:center;font:italic 900 46px monospace;margin:4px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:sticky;bottom:10px}
.sh{animation:sh .4s}@keyframes sh{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fl{position:fixed;left:0;right:0;top:38%;text-align:center;font:italic 900 56px sans-serif;text-shadow:0 0 16px currentColor;pointer-events:none;animation:fl .9s forwards;z-index:9}

.lu{position:fixed;inset:0;background:#000e;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}

a.l{background:none;border:0;color:#FF1744cc;font:700 11px sans-serif;width:100%;margin-top:6px}

<script>
const $=s=>document.querySelector(s),R=a=>a[Math.floor(Math.random()*a.length)],N=(a,b,s=1)=>a+s*Math.floor(Math.random()*((b-a)/s+1));
const pl=(n,a,b,c)=>n==1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sl=ms=>new Promise(r=>setTimeout(r,ms));
const LS={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let ac;const beep=(f,d=.12)=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.12;o.start();o.stop(ac.currentTime+d)}catch(e){}};

/* ===== PROGRESJA ===== */
const cum=l=>{const n=l-1;return 50*n+5*n*(n-1)/2},need=l=>50+5*(l-1);
const lvl=r=>{let l=1;while(l<50&&r>=cum(l+1))l++;return l};
const RANK=[[50,"Blacklist #1"],[45,"Blacklist Top 5"],[40,"Legend"],[35,"Kingpin"],[30,"Cop Dodger"],[25,"Underground King"],[20,"Night Runner"],[15,"Tuner"],[10,"Drifter"],[5,"Street Rat"],[1,"Rookie"]];
const rank=l=>RANK.find(x=>l>=x[0])[1],tier=l=>l>=25?3:l>=10?2:1;

/* ===== KATEGORIE ===== */
const CATS={burn:["UPALANIE","#FF5500","🔥","Dym, donuty, starty"],drift:["DRIFT ZONE","#00F0FF","💨","Poślizgi i łuki"],speed:["SPEED RUN","#FFD400","⚡","Sprinty i hamowania"],precision:["PRECYZJA","#39FF14","🎯","Slalomy i centymetry"],reverse:["REVERSE","#FF2EC4","↩️","Wszystko tyłem"],sound:["SOUND CHECK","#B84DFF","🔊","Odcięcia i koncert wydechu"],duel:["DUEL","#FF1744","🏁","Ty kontra rywal"],legend:["LEGEND","#FFFFFF","⭐","Zadania na wspomnienia"]};

/* ===== GENERATOR KART (tysiące kombinacji = karty się nie kończą) ===== */
const MOD=["bez zgaszenia silnika","z włączonymi światłami awaryjnymi","z muzyką na maksa","z pasażerem komentującym jak w transmisji","przy wyłączonym radiu – słuchacie tylko silnika","z okrzykiem swojej ksywy na starcie","bez patrzenia w obrotomierz"];
const WIT=["Ekipa ocenia 1–10, od 7 zaliczone.","Ekipa mierzy stoperem.","Ekipa nagrywa film z boku.","Sędzią jest gracz po twojej prawej.","Zaliczone, gdy większość ekipy klaszcze.","Zaliczone, jeśli nikt nie odwróci wzroku."];
const RIV=["graczem po lewej","graczem po prawej","najlepszym kierowcą ekipy","rywalem wylosowanym przez ekipę","kimś, kto cię dziś pokonał"];
const G={
burn:[
()=>{const s=N(4,16);return[`Burnout: min. ${s} s ciągłego dymu, ${R(MOD)}.`,s>11?3:s>7?2:1,s+8]},
()=>{const k=N(2,8);return[`${k} ${pl(k,'donut','donuty','donutów')} pod rząd wokół jednego pachołka, ${R(MOD)}. ${R(WIT)}`,k>5?3:k>3?2:1,k*9]},
()=>{const m=N(5,12);return[`Donut w kółku o średnicy max ${m} m – im ciaśniej, tym lepiej. Środek wyznacza ${R(['pachołek','butelka','znak kredą'])}, którego nie wolno ruszyć. ${R(WIT)}`,m<7?3:2]},
()=>{const d=N(30,150,10);return[`Start z miejsca na ${d} m z odcięciem w pierwszym biegu, ${R(MOD)}.`,d>100?2:1]},
()=>{const k=N(2,5);return[`Ósemka z dymem: ${k} ${pl(k,'pętla','pętle','pętli')} bez przerwy w poślizgu, ${R(MOD)}.`,k>3?3:2,k*14]},
()=>[`Zostaw gumą ślad w kształcie ${R(['litery L','litery S','ósemki','strzałki','cyfry 7'])}, długość min. ${N(8,25)} m. ${R(WIT)}`,2]],
drift:[
()=>{const s=N(2,10);return[`Utrzymaj poślizg przez ${s} s na ${R(['łuku','kółku o promieniu 10 m','zakręcie 90°','nawrocie'])}, ${R(MOD)}.`,s>7?3:s>4?2:1,s+20]},
()=>{const k=N(2,5);return[`Zmień kierunek poślizgu ${k} ${pl(k,'raz','razy','razy')} pod rząd, bez wyprowadzania auta. ${R(WIT)}`,k>3?3:2,40]},
()=>{const a=N(15,45,5);return[`Drift z kątem min. ${a}° przez cały łuk. ${R(WIT)}`,a>35?3:a>25?2:1]},
()=>[`Zainicjuj poślizg ${R(['ręcznym','wahadłem (flick w drugą stronę)','gwałtownym odpuszczeniem gazu','szarpnięciem kierownicy'])} i trzymaj go do ${R(['końca łuku','pachołka','kreski'])}.`,R([1,2,2])],
()=>{const m=N(1,3);return[`Drift tak, by przód minął pachołek o max ${m} m, niczego nie strącając.`,m<2?3:2]}],
speed:[
()=>{const d=N(50,300,50);return[`${d} m z miejsca na czas. Pierwszy gracz ustawia rekord, kolejni go biją, ${R(MOD)}.`,d>150?2:1]},
()=>{const v=N(40,90,10);return[`Hamowanie awaryjne z ${v} km/h – zatrzymaj się w strefie ${Math.round(v/2.5)} m.`,v>70?3:v>50?2:1]},
()=>{const k=N(5,10),m=N(7,12),t=N(20,45);return[`Slalom ${k} pachołków co ${m} m w limicie ${t} s, bez strąceń.`,t<28?3:2,t]},
()=>{const x=N(1,3);return[`Przejedź swoje okrążenie 3 razy z rzędu – czasy mogą się różnić o max ${x} s.`,x<2?3:2]},
()=>[`Pobij czas poprzedniego gracza na pełnym okrążeniu, ${R(MOD)}.`,2,60]],
precision:[
()=>{const c=N(10,40,5),v=N(20,50,10);return[`Zatrzymaj przód auta max ${c} cm od pachołka, jadąc ${v} km/h. Bez dotknięcia. 3 próby.`,c<20?3:c<30?2:1]},
()=>{const c=N(20,50,10);return[`Zaparkuj ${R(['tyłem','przodem','równolegle'])} w boksie szerokości auta + ${c} cm. Bez poprawek.`,c<30?3:2]},
()=>{const c=N(15,40,5),m=N(10,25,5);return[`Tunel z butelek: odstęp auto + ${c} cm, długość ${m} m. Przejedź ${R(['przodem','tyłem'])} bez strącenia.`,c<25?3:2]},
()=>{const k=N(4,8),s=N(10,30,5);return[`Ekipa układa tor z ${k} ${pl(k,'pachołka','pachołków','pachołków')}. Oglądasz go ${s} s i jedziesz z pamięci bez błędu.`,k>6?3:2,s]}],
reverse:[
()=>{const m=N(20,60,10),t=N(10,25);return[`${m} m tyłem ${R(['prosto','po łuku','slalomem między 4 pachołkami'])} w ${t} s, ${R(MOD)}.`,t<14?3:2,t]},
()=>{const v=N(10,25,5),c=N(20,50,10);return[`Cofając z ${v} km/h zatrzymaj tył max ${c} cm przed pachołkiem.`,v>15?3:2]},
()=>{const v=N(20,35,5);return[`J-turn: cofając z ok. ${v} km/h obróć auto o 180° i ruszaj przodem bez zatrzymania. ${R(WIT)}`,3]},
()=>[`Ósemka wokół dwóch pachołków w całości na wstecznym, ${R(MOD)}.`,2,45]],
sound:[
()=>{const r=N(3000,6000,500),s=N(2,6);return[`Kręć silnik do ok. ${r} obr./min i trzymaj ${s} s (jeśli auto to lubi). Ekipa zgaduje obroty bez patrzenia na zegar.`,s>4?2:1]},
()=>[`Zagraj gazem rytm: ${R(['stomp-stomp-clap','dwa krótkie, jeden długi','trzy szybkie i pauza','galop konia'])}. Ekipa klaszcze, a ty nie możesz się pomylić przez 10 s.`,1,15],
()=>{const k=N(2,5),m=N(6,9);return[`${k} ${pl(k,'redukcja','redukcje','redukcji')} z międzygazem. Ekipa daje oceny 1–10, średnia min. ${m}.`,m>7?3:2]},
()=>{const g=N(3,5),d=N(100,250,50);return[`Zmieniaj biegi od 1 do ${g} bez przerwy w gazie na ${d} m. Ekipa ocenia płynność.`,g>4?3:2]},
()=>[`Przejedź obok ekipy (min. 10 m od niej) w 2 biegu z gazem do odcięcia. Zaliczone, jeśli ktoś krzyknie „TO BRZMI!”.`,2]],
duel:[
()=>{const k=R([1,2]);return[`Pojedynek z ${R(RIV)}: ${R(['sprint 50 m','slalom 5 pachołków','parkowanie tyłem','hamowanie z 40 km/h na pachołek','donuty przez 15 s','okrążenie toru'])}. Zaliczone przy wygranej ${k>1?'2 z 3 startów':'w jednym starcie'}.`,k>1?3:R([1,2])]},
()=>[`Rywal (${R(RIV)}) wymyśla zadanie za kółkiem na max ${N(20,40,10)} s. Wykonaj je bez dyskusji, na zamkniętym odcinku.`,2],
()=>[`Wskaż rywala i pobij jego czas na pełnym okrążeniu, ${R(MOD)}.`,3,60]],
legend:[
()=>{const s=N(8,20,2);return[`Nagraj ${s}-sekundowy film z ${R(['donutem','burnoutem','driftem','przejazdem konwoju','slalomem'])} w kadrze jak z ${R(['reklamy','teledysku','gry wyścigowej','filmu akcji'])}. Ekipa ocenia 1–10, od 7 zaliczone.`,1]},
()=>{const s=N(2,6);return[`Auta w rzędzie. Na komendę wszyscy ${R(['dają gaz do odcięcia','robią burnout','zapalają światła awaryjne'])} przez ${s} s. Zdjęcie całej ekipy w kadrze.`,2,30]},
()=>[`Zrób ${R(['pierwszy w życiu','najdłuższy w życiu','najczystszy w życiu'])} ${R(['donut','drift','burnout','J-turn'])}. Ekipa jest świadkiem i potwierdza.`,R([1,2,3])],
()=>[`Nadaj swojemu autu nową ksywę i zrób wjazd bohatera wokół placu. Ekipa ocenia show 1–10.`,1]]
};
/* ręcznie pisane klasyki: [kategoria, tier, tekst, timer] */
const CL=[["burn",1,"PIERWSZA GUMA: burnout min. 5 s dymu. Ekipa liczy na głos.",10],["burn",2,"MGŁA: burnout, a ekipa 15 m dalej robi zdjęcia jak do teledysku."],["burn",3,"KARUZELA: w trakcie donutu pasażer recytuje alfabet A–Z bez pomyłki."],
["drift",1,"STAŁY KĄT: utrzymaj poślizg na łuku 3 s i wyjedź prosto."],["drift",2,"WAHADŁO: wychyl auto w drugą stronę przed zakrętem i utrzymaj poślizg przez nawrót."],["drift",3,"SPIRALA: drift na okręgu 15 m, zmniejszaj promień do 6 m bez wyjścia z poślizgu.",40],
["speed",1,"KRZYK NA PROSTEJ: gaz do oporu na 80 m, ekipa ryczy „BLACKLIST!” od startu do mety."],["speed",2,"TRZY RAZY TO SAMO: 3 okrążenia z rzędu z różnicą czasu max 1 s."],["speed",3,"OSTATNIA SEKUNDA: hamuj jak najbliżej pachołka 30 m przed zakrętem i wyjdź czysto."],
["precision",1,"TUNEL Z BUTELEK: dwa rzędy, odstęp auto + 20 cm, 15 m, bez strącenia."],["precision",2,"PUNKT HAMOWANIA: ekipa kładzie pachołek, z 50 km/h zatrzymaj przód równo z nim (±20 cm)."],["precision",3,"TOR Z PAMIĘCI: 6 pachołków, 20 s oglądania, potem bezbłędny przejazd.",20],
["reverse",1,"WSTECZNY SPRINT: 30 m tyłem prosto, max 1 m od osi."],["reverse",2,"RÓWNOLEGŁY W JEDEN RUCH: boks auto + 1 m, jeden płynny manewr."],["reverse",3,"J-TURN: cofając z ok. 30 km/h obróć auto o 180° i ruszaj przodem bez zatrzymania."],
["sound",1,"DO-RE-MI GAZEM: trzy zmiany obrotów, równe i czytelne.",15],["sound",2,"CICHA JAZDA: 50 m na biegu jałowym przy najniższych obrotach, bez strzału i gaśnięcia."],["sound",3,"SŁUCHOWY SPRAWDZIAN: pasażer z zamkniętymi oczami wskazuje zmiany biegów 1–4 na słuch.",20],
["duel",1,"ZAKŁAD 50 M: wybierz rywala, sprint z miejsca. Zaliczone, gdy jesteś szybszy."],["duel",2,"POJEDYNEK DONUTÓW: rywal robi donut, ty bijesz go liczbą obrotów w 15 s.",15],["duel",3,"REWANŻ ROKU: wybierz rywala, który cię dziś pokonał, i wygraj czystym okrążeniem."],
["legend",1,"WJAZD KONWOJU: wszyscy kolejno wokół placu ze światłami awaryjnymi i okrzykiem „BLACKLIST!”."],["legend",2,"PIERWSZY RAZ: zrób coś, czego jeszcze nigdy nie robiłeś za kółkiem. Ekipa potwierdza."],["legend",3,"LEGENDA ZLOTU: trik dnia – zaliczone, gdy połowa ekipy głosuje na ciebie."]];

let lastT=null,lastC=null;
function pick(cats,maxD){
  const seen=new Set(LS.g('bl_seen',[]));let q=null;
  for(let i=0;i<80&&!q;i++){
    const c=R(cats);if(cats.length>1&&c==lastC&&i<60)continue;
    let x;
    if(Math.random()<.25){const p=CL.filter(z=>z[0]==c&&z[1]<=maxD&&!seen.has(z[2]));if(p.length)x=R(p)}
    if(!x){const g=R(G[c])();x=[c,g[1],g[0],g[2]]}
    if(x[1]>maxD||x[2]==lastT||(seen.has(x[2])&&i<70))continue;
    q=x;
  }
  if(!q){const c=R(cats),g=R(G[c])();q=[c,Math.min(g[1],maxD),g[0],g[2]]}
  seen.add(q[2]);LS.s('bl_seen',[...seen].slice(-800));lastT=q[2];lastC=q[0];
  return{c:q[0],d:q[1],t:q[2],s:q[3]};
}

/* ===== STAN ===== */
const MOT=["Nie zostaniesz legendą, jadąc grzecznie. Dziś zostawiasz ślad.","Wspomnienia robi się z dymu, nie z postojów.","Kto nie pali opon, ten nie pali się do jazdy.","Tor nie wybacza lenistwa. Ekipa nie wybacza nudy.","Każdy ślad na asfalcie to podpis. Podpisz się czytelnie.","Dziś twoja ksywa trafia na listę.","Strach zostaje na linii startu. Gaz idzie ze mną.","Najlepsze historie zaczynają się od jednego donuta."];
let S={scr:'intro',mode:'solo',cats:Object.keys(CATS),pc:2,rounds:5,names:['','','',''],players:[],cur:0,round:1,card:null,rep:LS.g('bl_rep',0),ph:'idle',left:0,cdv:3,busy:false,mot:R(MOT)};
let tk=0;
const L=()=>lvl(S.rep),into=()=>S.rep-cum(L()),prog=()=>L()>=50?1:into()/need(L());
function bar(v,n=24,c='#FF5500',hot=1){let h=`<div class=tb style="--c:${c}">`;for(let i=0;i<n;i++)h+=`<i class="${(i+.5)/n<=v?'on':''} ${hot&&i>=n*.8?'hot':''}"></i>`;return h+'</div>'}
const LOGO=`<svg viewBox="0 0 200 150" width="170"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#FF5500"/><stop offset="1" stop-color="#FF1744"/></linearGradient><linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#FF5500"/></linearGradient></defs><path d="M30 6H192V118L170 144H8V28Z" fill="#000" stroke="#FF5500" stroke-width="3"/><path d="M56 124A62 62 0 1 1 144 124" fill="none" stroke="url(#g)" stroke-width="9" stroke-dasharray="2 5"/><line x1="100" y1="82" x2="138" y2="52" stroke="#FF1744" stroke-width="4"/><text x="98" y="108" font-size="76" font-weight="900" font-style="italic" text-anchor="middle" fill="url(#h)" font-family="Impact,Arial Black,sans-serif">B</text><text x="160" y="136" font-size="14" font-weight="900" font-style="italic" fill="#00F0FF" font-family="Arial">#1</text></svg>`;
const prof=()=>`<div class=fr><div class=row><b class=or>LVL ${L()}</b><span>${rank(L()).toUpperCase()}</span><em>${into()}/${need(L())} REP</em></div>${bar(prog())}<small>NOS · DROGA DO BLACKLIST #1 · ${L()}/50</small>${bar(L()/50,30,'#00F0FF',0)}<small>TIER ${tier(L())}/3 · TIER 2 od LVL 10 · TIER 3 od LVL 25</small></div>`;

const tmHTML=()=>{const c=S.card;if(S.ph=='idle')return`<button class="btn cy" onclick="A.timer()">ODPAL TIMER<small>${c.s} s</small></button>`;if(S.ph=='cd')return`<b class="big or">${S.cdv}</b>`;if(S.ph=='run'){const h=S.left<=5;return`<b class="big ${h?'rd':'cy'}">${S.left.toFixed(1)}</b>${bar(S.left/c.s,28,h?'#FF1744':'#00F0FF',0)}`}return`<b class="big rd">CZAS MINĄŁ!</b>`};
const tm=()=>{const e=$('#tm');if(e)e.innerHTML=tmHTML()};

const V={
intro:()=>`<div class=c>${LOGO}<div class=wm>BLACKLIST</div><div class=sub>UPALANIE · DRIFT · REP</div><p class=q>„${S.mot}”</p><div class="fr red"><b style="color:#FF1744;font:italic 900 15px sans-serif">ROBISZ TO NA WŁASNĄ ODPOWIEDZIALNOŚĆ</b><small style="color:#aab;font-weight:500;font-size:11px;line-height:1.4">Wyzwania wykonuj wyłącznie na zamkniętym odcinku lub torze, za zgodą właściciela terenu. Pasy zapięte, widzowie w bezpiecznej odległości, kierowca trzeźwy, auto sprawne.</small></div><button class="btn on" style="max-width:340px" onclick="A.go('home')">WCHODZĘ<small>Biorę odpowiedzialność na siebie</small></button></div>`,
home:()=>`<div style="text-align:center;padding-top:8px">${LOGO}<div class=wm>BLACKLIST</div><div class=sub>UPALANIE · DRIFT · REP</div></div>${prof()}<button class="btn on" onclick="A.setup('solo')">SOLO GRIND<small>Nabijaj levele. Od Rookie do Blacklist #1.</small></button><button class="btn cy" onclick="A.setup('crew')">CREW BATTLE<small>2–4 graczy · jeden telefon · ksywki</small></button><button class="btn w" onclick="A.share()">📲 ZAPROŚ EKIPĘ</button><p class=mut>Wyzwania wykonuj wyłącznie na zamkniętym odcinku lub torze, za zgodą właściciela terenu. Robisz to na własną odpowiedzialność.</p><button class=l onclick="A.reset()">RESET PROFILU</button>`,
setup:()=>`<button class=x style="width:auto;padding:0 14px" onclick="A.go('home')">‹ GARAŻ</button><h2>${S.mode=='solo'?'SOLO GRIND':'CREW BATTLE'}</h2>${S.mode=='crew'?`<h3>LICZBA GRACZY</h3><div class=pills>${[2,3,4].map(n=>`<button class="${S.pc==n?'on':''}" onclick="S.pc=${n};render()">${n}</button>`).join('')}</div><h3>KSYWKI</h3>${[...Array(S.pc).keys()].map(i=>`<input maxlength=14 placeholder="KSYWA GRACZA ${i+1}" value="${esc(S.names[i])}" oninput="S.names[${i}]=this.value">`).join('')}<h3>RUND NA GRACZA</h3><div class=pills>${[3,5,10].map(n=>`<button class="${S.rounds==n?'on':''}" onclick="S.rounds=${n};render()">${n}</button>`).join('')}</div>`:''}<h3>KATEGORIE</h3>${Object.entries(CATS).map(([k,v])=>`<button class="chip ${S.cats.includes(k)?'on':''}" style="--c:${v[1]}" onclick="A.tg('${k}')"><span>${v[2]}</span><div>${v[0]}<small>${v[3]}</small></div></button>`).join('')}<p class=mut>Odblokowany TIER: ${tier(L())}/3 (twój level: ${L()}). Karty generują się w nieskończoność i nie powtarzają.</p><button class="btn on" onclick="A.start()">START<small>Odpal silnik</small></button>`,
game:()=>{const c=S.card,v=CATS[c.c],u=S.mode=='solo'?'REP':'PKT',top=S.mode=='solo'?`<div class=row><b class=or style="font-size:20px">LVL ${L()}</b><span style="font-size:11px">${rank(L()).toUpperCase()}</span><em>${into()}/${need(L())}</em></div>${bar(prog(),20)}`:`<small>RUNDA ${Math.min(S.round,S.rounds)}/${S.rounds}</small><div class="cy big2">TURA: ${S.players[S.cur].n}</div>`;
return`<div class=top><button class=x onclick="A.exit()">✕</button><div style="flex:1">${top}</div></div>${S.mode=='crew'?`<div class=scs>${S.players.map((p,i)=>`<div class="sc ${i==S.cur?'a':''}"><small>${p.n}</small><b>${p.sc}</b></div>`).join('')}</div>`:''}<div class="fr card" style="--c:${v[1]}"><div class=row><span class=tag style="background:${v[1]}">${v[2]} ${v[0]}</span><small>TIER ${c.d}</small></div><p class=tx>${c.t}</p>${c.s?`<div id=tm>${tmHTML()}</div>`:''}</div><div class=acts><button class="btn red" ${S.busy?'disabled':''} onclick="A.res(false)">WYMIĘKAM<small>-${10*c.d} ${u} / utrata tury</small></button><button class="btn on" ${S.busy?'disabled':''} onclick="A.res(true)">ZALICZONE<small>+${20*c.d} ${u}</small></button></div>`},
end:()=>{const r=[...S.players].sort((a,b)=>b.sc-a.sc);return`<div class=c><h2 class=cy style="color:#00F0FF">KONIEC WYŚCIGU</h2><small>BLACKLIST #1</small><div class=wm style="font-size:38px">${r[0].n}</div><div style="width:100%">${r.map((p,i)=>`<div class=fr style="--c:${i?'#00F0FF':'#FF5500'};margin:8px 0;padding:12px"><div class=rl><span>#${i+1}</span><span>${p.n}</span><em>${p.sc} PKT</em></div></div>`).join('')}</div><button class="btn on" onclick="A.again()">REWANŻ</button><button class="btn cy" onclick="A.go('home')">GARAŻ</button></div>`}
};
function render(){$('#app').innerHTML=V[S.scr]()}

const fl=(t,ok)=>{const e=document.createElement('div');e.className='fl';e.style.color=ok?'#FF5500':'#FF1744';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),900)};
const A={
go(s){tk++;S.scr=s;render();window.scrollTo(0,0)},
setup(m){S.mode=m;A.go('setup')},
tg(k){const i=S.cats.indexOf(k);if(i>=0){if(S.cats.length>1)S.cats.splice(i,1)}else S.cats.push(k);render()},
start(){S.players=S.mode=='solo'?[{n:'YOU',sc:0}]:[...Array(S.pc).keys()].map(i=>({n:esc((S.names[i]||'').trim().toUpperCase())||'RACER '+(i+1),sc:0}));S.cur=0;S.round=1;S.busy=false;S.ph='idle';S.card=pick(S.cats,tier(L()));vib(30);A.go('game')},
again(){S.players.forEach(p=>p.sc=0);S.cur=0;S.round=1;S.busy=false;S.ph='idle';S.card=pick(S.cats,tier(L()));S.scr='game';render()},
exit(){if(confirm('Zakończyć grę?'))A.go('home')},
async timer(){const id=++tk,c=S.card;S.ph='cd';for(let n=3;n>0;n--){S.cdv=n;tm();beep(660);vib(30);await sl(800);if(id!=tk)return}S.cdv='GO!';tm();beep(990,.3);vib(60);await sl(500);S.ph='run';S.left=c.s;while(S.left>0){if(id!=tk)return;tm();await sl(100);S.left=Math.max(0,+(S.left-.1).toFixed(1));if(S.left>0&&S.left<=5&&Math.abs(S.left-Math.round(S.left))<.01){beep(440,.05);vib(15)}}if(id!=tk)return;S.ph='end';tm();beep(200,.5);vib([200,80,200])},
res(ok){if(S.busy)return;S.busy=true;tk++;const c=S.card,d=ok?20*c.d:-10*c.d;let up=0;
 if(S.mode=='solo'){const o=L();S.rep=Math.max(0,ok?S.rep+d:Math.max(S.rep+d,cum(o)));LS.s('bl_rep',S.rep);if(L()>o)up=L()}else{const p=S.players[S.cur];p.sc=Math.max(0,p.sc+d)}
 ok?vib(60):vib([120,60,120]);fl((d>0?'+':'')+d+(S.mode=='solo'?' REP':' PKT'),ok);
 if(!ok){const a=$('#app');a.classList.add('sh');setTimeout(()=>a.classList.remove('sh'),400)}
 render();
 setTimeout(()=>{if(up){beep(880,.3);vib([80,40,80,40,160]);const e=document.createElement('div');e.className='lu';e.innerHTML=`<b>LEVEL UP</b><span>LVL ${up}</span><div style="font:italic 800 20px sans-serif">${rank(up).toUpperCase()}</div>${up==10||up==25?'<small style="color:#FFD400;font-size:13px">ODBLOKOWANO NOWY TIER ZADAŃ</small>':''}`;document.body.appendChild(e);setTimeout(A.next,2300)}else A.next()},up?700:900)},
next(){document.querySelectorAll('.lu').forEach(e=>e.remove());S.busy=false;S.ph='idle';
 if(S.mode=='crew'){S.cur++;if(S.cur>=S.players.length){S.cur=0;S.round++}if(S.round>S.rounds){S.scr='end';vib([80,40,80]);render();return}}
 S.card=pick(S.cats,tier(L()));render()},
share(){const t='🔥 BLACKLIST – apka na zloty i tor: upalanie, drift, duele i levele od Rookie do Blacklist #1. Wbijaj do ekipy!',u=location.href;if(navigator.share)navigator.share({title:'BLACKLIST',text:t,url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(t+' '+u)}catch(e){}alert('Link skopiowany – wyślij ekipie!')}},
reset(){if(confirm('Zresetować cały postęp (REP i level)?')){S.rep=0;LS.s('bl_rep',0);LS.s('bl_seen',[]);render()}}
};
render();
</script>

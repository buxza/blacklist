<script>
/* ============================================================================
   KONFIGURACJA ADMINISTRATORA I OPCJONALNEJ SYNCHRONIZACJI CHMUROWEJ (GITHUB PAGES)
   ============================================================================ */
const ADMIN_CRED = {
  user: 'BLACKLIST_BOSS',
  pass: 'NITRO#2026'
};

/* Opcjonalnie: wklej adres swojego darmowego Firebase Realtime DB (np. https://twoj-projekt-default-rtdb.europe-west1.firebasedatabase.app)
   oraz Cloudinary (cloudName + uploadPreset), aby ranking i filmy były wspólne dla wszystkich odwiedzających GitHub Pages.
   Bez wypełniania tych pól aplikacja działa w 100% lokalnie w IndexedDB + LocalStorage! */
const DEFAULT_CLOUD = {
  firebaseUrl: '',
  cloudinaryCloud: '',
  cloudinaryPreset: ''
};

const $=s=>document.querySelector(s),R=a=>a[Math.floor(Math.random()*a.length)],N=(a,b,s=1)=>a+s*Math.floor(Math.random()*((b-a)/s+1));
const pl=(n,a,b,c)=>n==1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;
const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sl=ms=>new Promise(r=>setTimeout(r,ms));
const LS={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let ac;const beep=(f,d=.12)=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.12;o.start();o.stop(ac.currentTime+d)}catch(e){}};

/* ===== INDEXED DB (PRZECHOWYWANIE PRAWDZIWYCH PLIKÓW WIDEO BEZ LIMITU 5MB) ===== */
const VDB = {
  db: null,
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((res,rej)=>{
      const req = indexedDB.open('BlacklistVideoDB', 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains('videos')) d.createObjectStore('videos', {keyPath:'id'});
      };
      req.onsuccess = e => { this.db = e.target.result; res(this.db); };
      req.onerror = e => rej(e);
    });
  },
  async add(item){
    const d = await this.open();
    return new Promise((res,rej)=>{
      const tx = d.transaction('videos','readwrite');
      tx.objectStore('videos').put(item);
      tx.oncomplete = () => res(item);
      tx.onerror = e => rej(e);
    });
  },
  async all(){
    const d = await this.open();
    return new Promise((res,rej)=>{
      const tx = d.transaction('videos','readonly');
      const req = tx.objectStore('videos').getAll();
      req.onsuccess = () => res((req.result||[]).sort((a,b)=>b.ts-a.ts));
      req.onerror = e => rej(e);
    });
  },
  async del(id){
    const d = await this.open();
    return new Promise((res,rej)=>{
      const tx = d.transaction('videos','readwrite');
      tx.objectStore('videos').delete(id);
      tx.oncomplete = () => res();
      tx.onerror = e => rej(e);
    });
  }
};

/* ===== PROGRESJA ===== */
const cum=l=>{const n=l-1;return 50*n+5*n*(n-1)/2},need=l=>50+5*(l-1);
const lvl=r=>{let l=1;while(l<50&&r>=cum(l+1))l++;return l};
const RANK=[[50,"Blacklist #1"],[45,"Blacklist Top 5"],[40,"Legend"],[35,"Kingpin"],[30,"Cop Dodger"],[25,"Underground King"],[20,"Night Runner"],[15,"Tuner"],[10,"Drifter"],[5,"Street Rat"],[1,"Rookie"]];
const rank=l=>RANK.find(x=>l>=x[0])[1],tier=l=>l>=25?3:l>=10?2:1;

/* ===== KATEGORIE ===== */
const CATS={
  burn:["UPALANIE","#FF5500","🔥","Dym, donuty, starty"],
  drift:["DRIFT ZONE","#00F0FF","💨","Poślizgi i łuki"],
  speed:["SPEED RUN","#FFD400","⚡","Sprinty i hamowania"],
  precision:["PRECYZJA","#39FF14","🎯","Slalomy i centymetry"],
  reverse:["REVERSE","#FF2EC4","↩️","Wszystko tyłem"],
  sound:["SOUND CHECK","#B84DFF","🔊","Odcięcia i wydech"],
  duel:["DUEL","#FF1744","🏁","Ty kontra rywal"],
  legend:["LEGEND","#FFFFFF","⭐","Zadania na wspomnienia"]
};

/* ===== BANK PONAD 920 ZADAŃ (MIN. 115 UNIKALNYCH KART NA KAŻDĄ Z 8 KATEGORII!) ===== */
function buildTaskBank(){
  const bank = {burn:[],drift:[],speed:[],precision:[],reverse:[],sound:[],duel:[],legend:[]};
  const mods = [
    "bez zgaszenia silnika",
    "z włączonymi światłami awaryjnymi",
    "przy wyłączonym radiu – słuchacie tylko silnika",
    "z okrzykiem swojej ksywy na starcie",
    "bez patrzenia na obrotomierz",
    "z pasażerem komentującym jak w transmisji sportowej",
    "w pełnym skupieniu – zero uśmiechu do końca próby",
    "z jednym krótkim mrugnięciem długimi przed startem",
    "przy otwartych szybach dla lepszego dźwięku",
    "w stylu czystego przejazdu pokazowego"
  ];
  const judges = [
    "Ekipa ocenia 1–10 (min. 7 zalicza).",
    "Sędzią głównym jest gracz po twojej prawej.",
    "Zaliczone, gdy wszyscy biją brawo.",
    "Ekipa mierzy czas na stoperze.",
    "Ekipa nagrywa ujęcie z boku na telefon."
  ];

  // 1. BURN (120 zadań - w tym AI Smoke/Motion & GPS)
  [3,4,5,6,7,8,9,10,12,14,15,18].forEach(s=>{
    bank.burn.push({t:`[AI KAMERA/WIDEO] Burnout: utrzymaj ciągły dym z opon przez min. ${s} s. System AI zmierzy gęstość dymu.`,d:s>10?3:s>6?2:1,s:s+5,ai:'cam_smoke',goal:s});
  });
  [2,3,4,5,6,7,8,9,10].forEach(k=>{
    mods.forEach(m=>{
      bank.burn.push({t:`Wykonaj ${k} ${pl(k,'donut','donuty','donutów')} wokół centralnego pachołka, ${m}.`,d:k>6?3:k>3?2:1,s:k*8,ai:k<=4?'cam_motion':null,goal:k*4});
    });
  });
  [4,5,6,7,8,9,10,11,12].forEach(m=>{
    bank.burn.push({t:`Ciasny donut w okręgu o maksymalnej średnicy ${m} m bez dotknięcia znacznika środka. ${R(judges)}`,d:m<=6?3:2,s:25,ai:null});
  });
  [40,60,80,100,120,150,200].forEach(dist=>{
    bank.burn.push({t:`[AI GPS] Dynamiczny start z miejsca na dystansie ${dist} m z pełną trakcją po uślizgu kół.`,d:dist>120?2:1,s:25,ai:'gps_dist',goal:dist});
  });
  ["litery S","ósemki","litery L","okręgu","strzałki","podwójnej pętli","litery U","cyfry 8","spirali","zygzaka"].forEach(sh=>{
    bank.burn.push({t:`Zostaw na zamkniętym placu ślad gumy w kształcie ${sh}. ${R(judges)}`,d:2,s:30,ai:'cam_motion',goal:10});
  });

  // 2. DRIFT (120 zadań)
  [2,3,4,5,6,7,8,9,10,12].forEach(s=>{
    mods.slice(0,6).forEach(m=>{
      bank.drift.push({t:`Utrzymaj kontrolowany poślizg na łuku przez ${s} s, ${m}.`,d:s>8?3:s>4?2:1,s:s+12,ai:'cam_motion',goal:s});
    });
  });
  [2,3,4,5,6].forEach(k=>{
    ["ręcznym","wahadłem (flick)","odpuszczeniem gazu","strzałem ze sprzęgła"].forEach(tech=>{
      bank.drift.push({t:`Przekładka (manji): zmień kierunek poślizgu ${k} ${pl(k,'raz','razy','razy')} pod rząd, inicjując ${tech}.`,d:k>4?3:2,s:35,ai:null});
    });
  });
  [15,20,25,30,35,40,45].forEach(deg=>{
    ["lewy łuk","prawy łuk","nawrót 180°","szeroki zakręt 90°","rondel treningowy"].forEach(turn=>{
      bank.drift.push({t:`[AI WIDEO/KAMERA] Drift pod kątem min. ${deg}° przez cały ${turn} bez wyprostowania kół.`,d:deg>=35?3:deg>=25?2:1,s:25,ai:'cam_motion',goal:8});
    });
  });
  [50,80,100,150,200].forEach(cm=>{
    bank.drift.push({t:`Clip zone: przejdź w poślizgu tak, aby tylny zderzak minął zewnętrzny pachołek o max ${cm} cm bez przewrócenia go.`,d:cm<=80?3:2,s:20,ai:null});
  });

  // 3. SPEED (120 zadań - dużo GPS!)
  [50,75,100,120,150,180,200,250,300,350,400].forEach(dist=>{
    mods.slice(0,5).forEach(m=>{
      bank.speed.push({t:`[AI GPS] Sprint z miejsca na dystansie ${dist} m na czas, ${m}.`,d:dist>250?3:dist>120?2:1,s:30,ai:'gps_dist',goal:dist});
    });
  });
  [30,40,50,60,70,80,90].forEach(spd=>{
    bank.speed.push({t:`[AI GPS] Rozpędź auto do dokładnie ${spd} km/h i wykonaj awaryjne hamowanie do zera w wyznaczonej strefie.`,d:spd>=70?3:spd>=50?2:1,s:25,ai:'gps_speed',goal:spd});
  });
  [4,5,6,7,8,9,10,12].forEach(cones=>{
    [15,20,25,30,35,40].forEach(lim=>{
      if(cones*2<=lim){
        bank.speed.push({t:`Szybki slalom między ${cones} pachołkami w limicie ${lim} s bez dotknięcia żadnego z nich.`,d:lim<22?3:2,s:lim,ai:null});
      }
    });
  });
  [1,2,3].forEach(diff=>{
    ["okrążeniu próbnym","odcinku pomiarowym 150 m","nawrocie z szykaną","ósemce technicznej"].forEach(trk=>{
      bank.speed.push({t:`Regularność: przejedź 3 próby na ${trk} z różnicą czasu max ${diff} s między przejazdami.`,d:diff==1?3:2,s:60,ai:null});
    });
  });

  // 4. PRECISION (120 zadań)
  [5,10,15,20,25,30,35,40,45,50].forEach(cm=>{
    [20,30,40,50].forEach(v=>{
      bank.precision.push({t:`Dojazd do celu: rozpędź się do ${v} km/h i zatrzymaj przedni zderzak max ${cm} cm przed pachołkiem (bez dotknięcia!).`,d:cm<=15?3:cm<=30?2:1,s:20,ai:null});
    });
  });
  [15,20,25,30,35,40,50,60].forEach(cm=>{
    ["przodem","tyłem","równolegle z prawej","równolegle z lewej","po skosie 45°"].forEach(park=>{
      bank.precision.push({t:`Zaparkuj ${park} w boksie o szerokości auta + ${cm} cm jednym płynnym ruchem bez korekty.`,d:cm<=25?3:2,s:25,ai:null});
    });
  });
  [4,5,6,7,8,9,10].forEach(k=>{
    [10,15,20,25,30].forEach(obs=>{
      bank.precision.push({t:`Pamięć toru: ekipa ustawia labirynt z ${k} pachołków. Patrzysz przez ${obs} s, po czym przejeżdżasz bez błędu.`,d:k>=8?3:2,s:obs,ai:null});
    });
  });

  // 5. REVERSE (115 zadań)
  [15,20,25,30,40,50,60,75,90,100].forEach(m=>{
    [10,15,20,25,30].forEach(t=>{
      if(m/t <= 5){
        bank.reverse.push({t:`[AI GPS] Przejedź ${m} m na biegu wstecznym w czasie poniżej ${t} s bez wyjechania z pasa.`,d:m/t>3.5?3:2,s:t,ai:'gps_dist',goal:m});
      }
    });
  });
  [3,4,5,6,7,8].forEach(cones=>{
    mods.slice(0,5).forEach(m=>{
      bank.reverse.push({t:`Slalom na biegu wstecznym między ${cones} pachołkami, ${m}.`,d:cones>=6?3:2,s:35,ai:null});
    });
  });
  [15,20,25,30,35].forEach(v=>{
    ["w lewo","w prawo"].forEach(dir=>{
      mods.slice(0,4).forEach(m=>{
        bank.reverse.push({t:`J-Turn (${dir}): cofając z prędkością ok. ${v} km/h obróć auto o 180° i kontynuuj jazdę przodem, ${m}.`,d:3,s:20,ai:'cam_motion',goal:6});
      });
    });
  });
  [1,2,3,4,5].forEach(loops=>{
    bank.reverse.push({t:`Wykonaj ${loops} ${pl(loops,'pełną ósemkę','pełne ósemki','pełnych ósemek')} wokół dwóch pachołków wyłącznie na biegu wstecznym.`,d:loops>=3?3:2,s:loops*25,ai:null});

const TASK_BANK = buildTaskBank();

const TOTAL_TASKS = Object.values(TASK_BANK).reduce((a,b)=>a+b.length,0);

let lastT=null, lastC=null;
function pick(cats, maxD, aiOnly=false){
  const seen = new Set(LS.g('bl_seen',[]));
  let pool = [];
  cats.forEach(c=>{
    const items = (TASK_BANK[c]||[]).map((item,idx)=>({...item, c, id:`${c}_${idx}`}));
    pool.push(...items);
  });
  if(aiOnly){
    const aiPool = pool.filter(x=>x.ai);
    if(aiPool.length) pool = aiPool;
  }
  let valid = pool.filter(x => x.d <= maxD && !seen.has(x.id) && x.t !== lastT);
  if(!valid.length) valid = pool.filter(x => x.d <= maxD && x.t !== lastT);
  if(!valid.length) valid = pool;

  // Preferuj inną kategorię niż poprzednio
  const diffCat = valid.filter(x => x.c !== lastC);
  const chosen = R(diffCat.length ? diffCat : valid);

  seen.add(chosen.id);
  LS.s('bl_seen', [...seen].slice(-1200));
  lastT = chosen.t;
  lastC = chosen.c;
  return chosen;
}

/* ===== SYNCHRONIZACJA RANKINGU I WIDEO (LOKALNA + OPCJONALNY FIREBASE DLA GITHUB PAGES) ===== */
async function syncUserLeaderboard(){
  const entry = {
    nick: (S.nick||'DRIVER_01').toUpperCase(),
    rep: S.rep,
    lvl: L(),
    rank: rank(L()),
    updated: Date.now()
  };
  let localBoard = LS.g('bl_board', []);
  const idx = localBoard.findIndex(x=>x.nick===entry.nick);
  if(idx>=0) localBoard[idx] = entry; else localBoard.push(entry);
  LS.s('bl_board', localBoard);

  if(S.cloud.firebaseUrl){
    try{
      const base = S.cloud.firebaseUrl.replace(/\/$/,'');
      const safeKey = entry.nick.replace(/[^A-Z0-9_-]/g,'_');
      await fetch(`${base}/leaderboard/${safeKey}.json`, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(entry)
      });
    }catch(e){}
  }
}

async function fetchLeaderboard(){
  let list = LS.g('bl_board', []);
  if(!list.some(x=>x.nick===S.nick)){
    list.push({nick:S.nick, rep:S.rep, lvl:L(), rank:rank(L()), updated:Date.now()});
  }
  // Przykładowe boty startowe jeśli ranking jest pusty, żeby tablica żyła od 1 sekundy
  if(list.length < 4){
    const seeds = [
      {nick:'RAZOR_PL', rep:1420, lvl:lvl(1420), rank:rank(lvl(1420))},
      {nick:'VEX_DRIFT', rep:890, lvl:lvl(890), rank:rank(lvl(890))},
      {nick:'TURBO_KASIA', rep:460, lvl:lvl(460), rank:rank(lvl(460))}
    ];
    seeds.forEach(sd=>{ if(!list.some(x=>x.nick===sd.nick)) list.push(sd); });
  }
  if(S.cloud.firebaseUrl){
    try{
      const base = S.cloud.firebaseUrl.replace(/\/$/,'');
      const r = await fetch(`${base}/leaderboard.json`);
      const data = await r.json();
      if(data){
        Object.values(data).forEach(item=>{
          const i = list.findIndex(x=>x.nick===item.nick);
          if(i>=0) list[i] = item; else list.push(item);
        });
      }
    }catch(e){}
  }
  return list.sort((a,b)=>b.rep-a.rep);
}

async function loadVideos(){
  let vids = [];
  try{
    const localVids = await VDB.all();
    vids = localVids.map(v=>({
      ...v,
      src: v.blob ? URL.createObjectURL(v.blob) : v.url
    }));
  }catch(e){}

  if(S.cloud.firebaseUrl){
    try{
      const base = S.cloud.firebaseUrl.replace(/\/$/,'');
      const r = await fetch(`${base}/videos.json`);
      const data = await r.json();
      if(data){
        Object.values(data).forEach(cv=>{
          if(!vids.some(x=>x.id===cv.id)) vids.push({...cv, src: cv.url, remote:true});
        });
      }
    }catch(e){}
  }
  S.videos = vids.sort((a,b)=>b.ts-a.ts);
}

  <button class="${S.vidFilter=='burn'?'on':''}" onclick="S.vidFilter=='burn';render()">🔥 UPALANIE</button>
  <button class="${S.vidFilter=='drift'?'on':''}" onclick="S.vidFilter=='drift';render()">💨 DRIFT</button>
  <button class="${S.vidFilter=='legend'?'on':''}" onclick="S.vidFilter=='legend';render()">⭐ LEGEND</button>
</div>

<div id="vid-list">
  ${(() => {
    const list = S.vidFilter=='ALL' ? S.videos : S.videos.filter(x=>x.cat===S.vidFilter);
    if(!list.length) return `<p class=mut style="padding:24px 0">Brak nagrań w tej kategorii. Bądź pierwszy i wrzuć przejazd!</p>`;
    return list.map(v => {
      const catInfo = CATS[v.cat] || CATS.legend;
      return `
      <div class="fr" style="--c:${catInfo[1]}">
        <div class=row>
          <span class=tag style="background:${catInfo[1]}">${catInfo[2]} ${catInfo[0]}</span>
          <b style="color:#00F0FF;font-size:13px">@${esc(v.nick)}</b>
          <small>${new Date(v.ts).toLocaleDateString('pl-PL')}</small>
        </div>
        <div style="font:700 15px sans-serif;margin:8px 0">${esc(v.title)}</div>
        <div class="vid-box">
          <video src="${v.src}" controls playsinline preload="metadata"></video>
        </div>
        <div class=row style="margin-top:8px">
          <button class="x" style="width:auto;padding:0 14px;color:#FF5500;box-shadow:inset 0 0 0 1.5px #FF5500" onclick="A.likeVideo('${v.id}')">🔥 ${v.likes||0}</button>
          ${S.isAdmin ? `<button class="x" style="width:auto;padding:0 12px;background:#FF1744;color:#fff;box-shadow:none" onclick="A.deleteVideo('${v.id}')">🗑️ USUŃ (ADMIN)</button>` : ''}
        </div>
      </div>`;
    }).join('');
  })()}
</div>`,

function render(){ $('#app').innerHTML = V[S.scr](); }

const fl=(t,ok)=>{
  const e=document.createElement('div');
  e.className='fl';
  e.style.color=ok?'#FF5500':'#FF1744';
  e.textContent=t;
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),900);
};

/* ===== AKCJE APLIKACJI ===== */
const A = {
  go(s){
    tk++;
    stopAI();
    S.scr=s;
    render();
    window.scrollTo(0,0);
  },
  setup(m, aiOnly=false){
    S.mode=m;
    S.aiOnly=aiOnly;
    A.go('setup');
  },
  tg(k){
    const i=S.cats.indexOf(k);
    if(i>=0){ if(S.cats.length>1) S.cats.splice(i,1); }
    else S.cats.push(k);
    render();
  },
  start(){
    S.players = S.mode=='solo'
      ? [{n:S.nick,sc:0}]
      : [...Array(S.pc).keys()].map(i=>({n:esc((S.names[i]||'').trim().toUpperCase())||'RACER '+(i+1),sc:0}));
    S.cur=0; S.round=1; S.busy=false; S.ph='idle';
    S.aiStatus='GOTOWY DO SKANOWANIA'; S.aiProgress=0; S.aiMetric='0.0';
    S.card = pick(S.cats, tier(L()), S.aiOnly);
    vib(30);
    A.go('game');
  },
  again(){
    S.players.forEach(p=>p.sc=0);
    S.cur=0; S.round=1; S.busy=false; S.ph='idle';
    S.aiStatus='GOTOWY DO SKANOWANIA'; S.aiProgress=0; S.aiMetric='0.0';
    S.card = pick(S.cats, tier(L()), S.aiOnly);
    S.scr='game';
    render();
  },
  exit(){
    if(confirm('Zakończyć bieżącą sesję?')) A.go('home');
  },

  /* --- TIMER --- */
  async timer(){
    const id=++tk, c=S.card;
    S.ph='cd';
    for(let n=3;n>0;n--){
      S.cdv=n; tm(); beep(660); vib(30);
      await sl(800);
      if(id!=tk) return;
    }
    S.cdv='GO!'; tm(); beep(990,.3); vib(60);
    await sl(500);
    S.ph='run'; S.left=c.s;
    while(S.left>0){
      if(id!=tk) return;
      tm();
      await sl(100);
      S.left=Math.max(0,+(S.left-.1).toFixed(1));
      if(S.left>0 && S.left<=5 && Math.abs(S.left-Math.round(S.left))<.01){
        beep(440,.05); vib(15);
      }
    }
    if(id!=tk) return;
    S.ph='end'; tm(); beep(200,.5); vib([200,80,200]);
  },

  /* --- AI VISION: ANALIZA RUCHU I DYMU Z KAMERY --- */
  async startCamAI(){
    stopAI();
    const wrap = $('#ai-media-wrap'), vid = $('#ai-vid'), cvs = $('#ai-cvs');
    if(!wrap || !vid) return;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
      wrap.style.display = 'block';
      vid.srcObject = stream;
      await vid.play();
      S.aiActive = true;
      S.aiStatus = 'SKANOWANIE OBRAZU AI...';
      renderAIHud();
      this.runFrameAnalyzer(vid, cvs, () => stream.getTracks().forEach(t=>t.stop()));
    }catch(e){
      alert('Brak dostępu do kamery lub przeglądarka zablokowała kamerę. Możesz użyć opcji Wgraj Wideo.');
    }
  },

  /* --- AI VISION: ANALIZA WGRANEGO PLIKU WIDEO --- */
  startVideoFileAI(input){
    const file = input.files && input.files[0];
    if(!file) return;
    stopAI();
    const wrap = $('#ai-media-wrap'), vid = $('#ai-vid'), cvs = $('#ai-cvs');
    const url = URL.createObjectURL(file);
    wrap.style.display = 'block';
    vid.srcObject = null;
    vid.src = url;
    vid.loop = false;
    vid.play();
    S.aiActive = true;
    S.aiStatus = 'ANALIZA KLATEK WIDEO AI...';
    renderAIHud();
    this.runFrameAnalyzer(vid, cvs, () => { vid.pause(); URL.revokeObjectURL(url); });
  },

  runFrameAnalyzer(vid, cvs, onStop){
    const ctx = cvs.getContext('2d', {willReadFrequently:true});
    cvs.width = 64; cvs.height = 48;
    let prev = null, score = 0;
    const goal = S.card.goal || 6;
    const mode = S.card.ai;

    const iv = setInterval(()=>{
      if(!S.aiActive || vid.paused || vid.ended) return;
      ctx.drawImage(vid, 0, 0, 64, 48);
      const frame = ctx.getImageData(0, 0, 64, 48).data;
      let motion = 0, smokePixels = 0;

      for(let i=0; i<frame.length; i+=4){
        const r=frame[i], g=frame[i+1], b=frame[i+2];
        const lum = (r+g+b)/3;
        const sat = Math.max(r,g,b) - Math.min(r,g,b);
        // Dym z opon: wysoka jasność + niska saturacja (szaro-biały)
        if(lum > 165 && sat < 32) smokePixels++;
        if(prev){
          const diff = Math.abs(r-prev[i]) + Math.abs(g-prev[i+1]) + Math.abs(b-prev[i+2]);
          if(diff > 75) motion++;
        }
      }
      prev = new Uint8ClampedArray(frame);
      const totalPx = 64*48;
      const motionRatio = motion / totalPx;
      const smokeRatio = smokePixels / totalPx;

      if(mode === 'cam_smoke'){
        if(motionRatio > 0.06 && smokeRatio > 0.14) score += 0.25;
        S.aiMetric = `DYM: ${Math.round(smokeRatio*100)}% | RUCH: ${Math.round(motionRatio*100)}%`;
      } else {
        if(motionRatio > 0.08) score += 0.25;
        S.aiMetric = `DYNAMIKA RUCHU: ${Math.round(motionRatio*100)}% (${score.toFixed(1)}s)`;
      }

      S.aiProgress = Math.min(1, score / goal);
      renderAIHud();

      if(S.aiProgress >= 1){
        S.aiStatus = '✅ ZADANIE ZWERYFIKOWANE PRZEZ AI!';
        renderAIHud();
        beep(1040, .35); vib([100,50,150]);
        stopAI();
        setTimeout(()=>A.res(true), 900);
      }
    }, 200);

    aiCleanup = () => { clearInterval(iv); onStop && onStop(); };
  },

  /* --- AI GPS: POMIAR PRĘDKOŚCI I DYSTANSU --- */
  startGpsAI(){
    if(!navigator.geolocation){
      alert('Twoje urządzenie nie obsługuje GPS.');
      return;
    }
    stopAI();
    S.aiActive = true;
    S.aiStatus = 'SZUKANIE SATELIT GPS...';
    renderAIHud();

    let startPos = null, maxSpd = 0, dist = 0;
    const goal = S.card.goal || 100;
    const mode = S.card.ai;

    const toRad = d => d * Math.PI / 180;
    const haversine = (a, b) => {
      const R = 6371000;
      const dLat = toRad(b.latitude - a.latitude);
      const dLon = toRad(b.longitude - a.longitude);
      const x = Math.sin(dLat/2)**2 + Math.cos(toRad(a.latitude))*Math.cos(toRad(b.latitude))*Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
    };

    const wid = navigator.geolocation.watchPosition(pos => {
      const c = pos.coords;
      if(!startPos) startPos = c;
      dist = haversine(startPos, c);
      const spdKmh = c.speed ? (c.speed * 3.6) : 0;
      if(spdKmh > maxSpd) maxSpd = spdKmh;

      S.aiStatus = `GPS AKTYWNY (±${Math.round(c.accuracy)}m)`;
      if(mode === 'gps_speed'){
        S.aiMetric = `${maxSpd.toFixed(1)} km/h`;
        S.aiProgress = Math.min(1, maxSpd / goal);
      } else {
        S.aiMetric = `${Math.round(dist)} m (${spdKmh.toFixed(0)} km/h)`;
        S.aiProgress = Math.min(1, dist / goal);
      }
      renderAIHud();

      if(S.aiProgress >= 1){
        S.aiStatus = '✅ CEL GPS OSIĄGNIĘTY!';
        renderAIHud();
        beep(1040, .35); vib([100,50,150]);
        stopAI();
        setTimeout(()=>A.res(true), 900);
      }
    }, err => {
      S.aiStatus = 'BŁĄD GPS: ' + err.message;
      renderAIHud();
    }, {enableHighAccuracy:true, maximumAge:0, timeout:10000});

    aiCleanup = () => navigator.geolocation.clearWatch(wid);
  },

  /* --- WYNIK KARTY --- */
  res(ok){
    if(S.busy) return;
    S.busy = true;
    tk++;
    stopAI();
    const c = S.card, d = ok ? 20*c.d : -10*c.d;
    let up = 0;

    if(S.mode=='solo'){
      const o = L();
      S.rep = Math.max(0, ok ? S.rep+d : Math.max(S.rep+d, cum(o)));
      LS.s('bl_rep', S.rep);
      syncUserLeaderboard();
      if(L()>o) up = L();
    } else {
      const p = S.players[S.cur];
      p.sc = Math.max(0, p.sc+d);
    }

    ok ? vib(60) : vib([120,60,120]);
    fl((d>0?'+':'')+d+(S.mode=='solo'?' REP':' PKT'), ok);

    if(!ok){
      const a=$('#app');
      a.classList.add('sh');
      setTimeout(()=>a.classList.remove('sh'),400);
    }
    render();

    setTimeout(()=>{
      if(up){
        beep(880,.3); vib([80,40,80,40,160]);
        const e=document.createElement('div');
        e.className='lu';
        e.innerHTML=`<b>LEVEL UP</b><span>LVL ${up}</span><div style="font:italic 800 20px sans-serif">${rank(up).toUpperCase()}</div>${up==10||up==25?'<small style="color:#FFD400;font-size:13px">ODBLOKOWANO NOWY TIER ZADAŃ</small>':''}`;
        document.body.appendChild(e);
        setTimeout(A.next,2200);
      } else {
        A.next();
      }
    }, up?700:900);
  },

  next(){
    document.querySelectorAll('.lu').forEach(e=>e.remove());
    S.busy=false; S.ph='idle';
    S.aiStatus='GOTOWY DO SKANOWANIA'; S.aiProgress=0; S.aiMetric='0.0';
    if(S.mode=='crew'){
      S.cur++;
      if(S.cur>=S.players.length){ S.cur=0; S.round++; }
      if(S.round>S.rounds){
        S.scr='end';
        vib([80,40,80]);
        render();
        return;
      }
    }
    S.card = pick(S.cats, tier(L()), S.aiOnly);
    render();
  },

  /* --- WIDEO FEED & MODERACJA --- */
  async openVideos(){
    A.go('videos');
    await loadVideos();
    render();
  },

  async uploadVideo(){
    const fileIn = $('#v-file');
    const file = fileIn && fileIn.files && fileIn.files[0];
    if(!file){ alert('Wybierz plik wideo z nagraniem zadania!'); return; }
    const nick = ($('#v-nick').value || S.nick || 'DRIVER').trim().toUpperCase();
    const cat = $('#v-cat').value;
    const title = ($('#v-title').value || 'Przejazd Blacklist').trim();
    const btn = $('#v-btn');
    btn.disabled = true; btn.textContent = 'PRZETWARZANIE WIDEO...';

    const id = 'vid_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    let remoteUrl = '';

    // Opcjonalny upload do Cloudinary + Firebase jeśli skonfigurowano
    if(S.cloud.cloudinaryCloud && S.cloud.cloudinaryPreset){
      try{
        const fd = new FormData();
        fd.append('file', file);
        fd.append('upload_preset', S.cloud.cloudinaryPreset);
        const upRes = await fetch(`https://api.cloudinary.com/v1_1/${S.cloud.cloudinaryCloud}/video/upload`, {method:'POST', body:fd});
        const upJson = await upRes.json();
        if(upJson.secure_url) remoteUrl = upJson.secure_url;
      }catch(e){}
    }

    const record = { id, nick, cat, title, ts: Date.now(), likes: 1, url: remoteUrl };
    await VDB.add({ ...record, blob: file });

    if(S.cloud.firebaseUrl && remoteUrl){
      try{
        const base = S.cloud.firebaseUrl.replace(/\/$/,'');
        await fetch(`${base}/videos/${id}.json`, {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(record)
        });
      }catch(e){}
    }

    // Bonus +30 REP za wrzucenie dowodu wideo
    S.nick = nick; LS.s('bl_nick', nick);
    S.rep += 30; LS.s('bl_rep', S.rep);
    await syncUserLeaderboard();
    fl('+30 REP ZA KLIP!', true);
    await loadVideos();
    render();
  },

  async likeVideo(id){
    const v = S.videos.find(x=>x.id===id);
    if(!v) return;
    v.likes = (v.likes||0) + 1;
    try{
      const all = await VDB.all();
      const loc = all.find(x=>x.id===id);
      if(loc){ loc.likes = v.likes; await VDB.add(loc); }
    }catch(e){}
    if(S.cloud.firebaseUrl){
      try{
        const base = S.cloud.firebaseUrl.replace(/\/$/,'');
        await fetch(`${base}/videos/${id}/likes.json`, {method:'PUT', body:JSON.stringify(v.likes)});
      }catch(e){}
    }
    beep(740,.08);
    render();
  },

  async deleteVideo(id){
    if(!S.isAdmin){ alert('Brak uprawnień administratora!'); return; }
    if(!confirm('ADMIN: Na pewno trwale usunąć to nagranie?')) return;
    await VDB.del(id);
    if(S.cloud.firebaseUrl){
      try{
        const base = S.cloud.firebaseUrl.replace(/\/$/,'');
        await fetch(`${base}/videos/${id}.json`, {method:'DELETE'});
      }catch(e){}
    }
    S.videos = S.videos.filter(x=>x.id!==id);
    fl('USUNIĘTO FILM', false);
    render();
  },

  /* --- RANKING --- */
  async openRank(){
    A.go('rank');
    const board = await fetchLeaderboard();
    const box = $('#rank-box');
    if(!box) return;
    box.innerHTML = board.map((p, i) => {
      const isMe = p.nick === S.nick;
      const medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : `#${i+1}`;
      return `
      <div class="fr" style="--c:${isMe?'#39FF14':(i===0?'#FF5500':'#00F0FF')};margin:8px 0;padding:12px">
        <div class="rl">
          <span style="min-width:34px">${medal}</span>
          <div>
            <div style="color:${isMe?'#39FF14':'#fff'}">${esc(p.nick)} ${isMe?'(TY)':''}</div>
            <small style="margin:0">${esc(p.rank)} · LVL ${p.lvl}</small>
          </div>
          <em>${p.rep} REP</em>
        </div>
      </div>`;
    }).join('');
  },

  /* --- USTAWIENIA I ADMIN --- */
  saveNick(){
    const val = ($('#s-nick').value || '').trim().toUpperCase();
    if(!val) return;
    S.nick = val;
    LS.s('bl_nick', val);
    syncUserLeaderboard();
    fl('ZAPISANO KSYWĘ', true);
    A.go('home');
  },
  saveCloud(){
    S.cloud = {
      firebaseUrl: ($('#c-fb').value||'').trim(),
      cloudinaryCloud: ($('#c-cc').value||'').trim(),
      cloudinaryPreset: ($('#c-cp').value||'').trim()
    };
    LS.s('bl_cloud', S.cloud);
    syncUserLeaderboard();
    fl('ZAPISANO CHMURĘ', true);
    A.go('home');
  },
  loginAdmin(){
    const u = ($('#adm-u').value||'').trim().toUpperCase();
    const p = ($('#adm-p').value||'').trim();
    if(u === ADMIN_CRED.user && p === ADMIN_CRED.pass){
      S.isAdmin = true;
      LS.s('bl_admin', true);
      beep(980,.2);
      fl('ADMIN ZALOGOWANY', true);
      render();
    } else {
      vib([150,60,150]);
      alert('Nieprawidłowy login lub hasło administratora!');
    }
  },
  logoutAdmin(){
    S.isAdmin = false;
    LS.s('bl_admin', false);
    render();
  },

  share(){
    const t='🔥 BLACKLIST – apka na zloty i tor: ponad 900 wyzwań, weryfikacja AI kamerą i GPS, ranking i wideo feed!', u=location.href;
    if(navigator.share) navigator.share({title:'BLACKLIST',text:t,url:u}).catch(()=>{});
    else { try{navigator.clipboard.writeText(t+' '+u)}catch(e){} alert('Link skopiowany – wyślij ekipie!'); }
  },
  reset(){
    if(confirm('Zresetować twój postęp (REP i level)?')){
      S.rep=0; LS.s('bl_rep',0); LS.s('bl_seen',[]);
      syncUserLeaderboard();
      render();
    }
  }
};

function renderAIHud(){
  const m = $('#ai-met');
  if(m) m.textContent = S.aiMetric;
  const st = document.querySelector('.fr.ai small');
  if(st) st.textContent = S.aiStatus;
  const tb = document.querySelector('.fr.ai .tb');
  if(tb){
    const bars = tb.querySelectorAll('i');
    bars.forEach((b,idx)=>{
      if((idx+.5)/bars.length <= S.aiProgress) b.classList.add('on');
      else b.classList.remove('on');
    });
  }
}

syncUserLeaderboard();
render();
</script>
